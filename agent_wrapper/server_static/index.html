<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-wrapper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f5f6f8;
      --surface: #ffffff;
      --surface-subtle: #f0f2f5;
      --ink: #17202c;
      --muted: #657182;
      --line: #d9dde3;
      --line-strong: #c2c9d2;
      --accent: #2667d9;
      --accent-strong: #1754bd;
      --accent-soft: #e8f0ff;
      --danger: #c83838;
      --terminal: #10151d;
      --terminal-bar: #171e28;
      --terminal-line: #293443;
      --terminal-ink: #e8edf5;
      --shadow: 0 10px 30px rgb(22 32 47 / 8%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #10141b;
        --surface: #171c25;
        --surface-subtle: #202733;
        --ink: #ecf0f5;
        --muted: #9ca8b8;
        --line: #303948;
        --line-strong: #475365;
        --accent: #78a8ff;
        --accent-strong: #9abfff;
        --accent-soft: #1d3156;
        --danger: #ff8888;
        --terminal: #0c1016;
        --terminal-bar: #151b24;
        --terminal-line: #2b3544;
        --terminal-ink: #e8edf5;
        --shadow: 0 10px 30px rgb(0 0 0 / 20%);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .48; }

    #setup-view { max-width: 1180px; margin: 0 auto; padding: 28px 32px 48px; }
    .app-header { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.025em; }
    .brand span { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .76rem; }
    .header-note { color: var(--muted); font-size: .84rem; }

    .setup-grid { display: grid; grid-template-columns: minmax(230px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
    .workspace-card { padding: 19px; }
    .section-kicker { margin: 0 0 7px; color: var(--accent); font-family: "IBM Plex Mono", monospace; font-size: .69rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; }
    h2 { margin: 0; font-size: .98rem; letter-spacing: -.01em; }
    .help { margin: 7px 0 16px; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .path-box { min-height: 69px; padding: 10px 11px; margin-bottom: 10px; overflow-wrap: anywhere; background: var(--surface-subtle); border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .75rem; line-height: 1.45; }
    .path-box.is-selected { color: var(--ink); }
    .recent-folders { display: grid; gap: 5px; margin-top: 14px; }
    .recent-folders-title { margin: 0; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .65rem; letter-spacing: .03em; text-transform: uppercase; }
    .recent-folder-btn { width: 100%; padding: 7px 8px; overflow-wrap: anywhere; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); color: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: .7rem; text-align: left; }
    .recent-folder-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 7px 11px; border: 1px solid transparent; border-radius: 6px; background: var(--accent); color: white; font-size: .82rem; font-weight: 500; }
    .button:hover:not(:disabled) { background: var(--accent-strong); }
    .button.secondary { border-color: var(--line-strong); background: var(--surface); color: var(--ink); }
    .button.secondary:hover:not(:disabled) { background: var(--surface-subtle); }
    .button.ghost { min-height: 30px; padding: 5px 8px; border-color: var(--line); background: transparent; color: var(--muted); }
    .button.ghost:hover:not(:disabled) { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); color: var(--danger); }
    .button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }

    .terminals-card { overflow: hidden; }
    .card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 13px; border-bottom: 1px solid var(--line); }
    .card-heading .help { margin: 3px 0 0; }
    .row-list { display: grid; }
    .terminal-row { display: grid; grid-template-columns: minmax(115px, 1.15fr) minmax(104px, .9fr) minmax(112px, 1fr) minmax(140px, 1.25fr) 32px; gap: 8px; align-items: end; padding: 11px 18px; border-bottom: 1px solid var(--line); }
    .terminal-row:hover { background: color-mix(in srgb, var(--accent) 3%, transparent); }
    .field { min-width: 0; }
    .field label { display: block; margin: 0 0 5px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .65rem; letter-spacing: .03em; text-transform: uppercase; }
    input, select { width: 100%; height: 33px; padding: 5px 8px; outline: none; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--ink); font-family: "IBM Plex Mono", monospace; font-size: .78rem; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .remove-row-btn { width: 30px; padding: 0; font-size: 1.12rem; line-height: 1; }
    .list-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px; }
    .row-count { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .72rem; }
    .start-bar { display: flex; justify-content: flex-end; margin-top: 18px; }
    #start-btn { min-width: 142px; min-height: 40px; }
    #status { min-height: 20px; margin: 10px 0 0; color: var(--muted); font-size: .8rem; text-align: right; }
    #status.error { color: var(--danger); }

    #terminal-view { display: none; height: 100vh; background: var(--terminal); }
    .terminal-topbar { display: flex; align-items: center; min-height: 42px; padding: 0 13px; border-bottom: 1px solid var(--terminal-line); background: var(--terminal-bar); color: var(--terminal-ink); }
    .terminal-topbar strong { font-size: .84rem; letter-spacing: .01em; }
    .terminal-topbar span { margin-left: 9px; color: #9caabe; font-family: "IBM Plex Mono", monospace; font-size: .69rem; }
    .terminal-grid { display: grid; height: calc(100vh - 42px); grid-template-columns: repeat(var(--pane-count), minmax(0, 1fr)); }
    .pane { display: flex; min-width: 0; min-height: 0; flex-direction: column; border-right: 1px solid var(--terminal-line); border-bottom: 1px solid var(--terminal-line); }
    .pane-header { display: flex; align-items: center; min-height: 38px; padding: 6px 10px; gap: 9px; background: var(--terminal-bar); color: var(--terminal-ink); }
    .pane-name { font-family: "IBM Plex Mono", monospace; font-size: .8rem; font-weight: 500; white-space: nowrap; }
    .pane-meta { overflow: hidden; color: #91a0b4; font-family: "IBM Plex Mono", monospace; font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; }
    .harness-badge { flex: none; padding: 2px 5px; border: 1px solid #3e5270; border-radius: 3px; color: #a8c7ff; font-family: "IBM Plex Mono", monospace; font-size: .62rem; line-height: 1.2; }
    .term { flex: 1; min-width: 0; min-height: 0; padding: 7px; }

    @media (max-width: 780px) {
      #setup-view { padding: 20px 14px 32px; }
      .app-header { margin-bottom: 18px; }
      .header-note { display: none; }
      .setup-grid { grid-template-columns: 1fr; }
      .terminal-row { grid-template-columns: 1fr 1fr; padding: 12px; }
      .terminal-row .field:nth-child(3), .terminal-row .field:nth-child(4) { grid-column: span 1; }
      .remove-row-btn { grid-column: 2; justify-self: end; margin-top: -2px; }
      .terminal-grid { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 42px); }
      #terminal-view { height: auto; min-height: 100vh; }
      .pane { height: max(380px, calc((100vh - 42px) / var(--pane-count))); }
    }
  </style>
</head>
<body>
  <main id="setup-view">
    <header class="app-header">
      <div class="brand"><h1>agent-wrapper</h1><span>LOCAL CONTROL PANEL</span></div>
      <div class="header-note">並列エージェントセッションを構成</div>
    </header>

    <div class="setup-grid">
      <section class="card workspace-card" aria-labelledby="workspace-title">
        <p class="section-kicker">Workspace</p>
        <h2 id="workspace-title">作業フォルダ</h2>
        <p class="help">すべてのターミナルをこのディレクトリで起動します。</p>
        <div class="path-box" id="folder-path">フォルダが選択されていません</div>
        <button class="button secondary" id="pick-folder-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          フォルダを選択
        </button>
        <div id="recent-folders" class="recent-folders" hidden></div>
      </section>

      <section class="card terminals-card" aria-labelledby="terminals-title">
        <div class="card-heading">
          <div><h2 id="terminals-title">ターミナル構成</h2><p class="help">各ペインで実行するエージェントとモデルを指定します。</p></div>
        </div>
        <div class="row-list" id="rows-body"></div>
        <div class="list-footer">
          <span class="row-count" id="row-count"></span>
          <button class="button secondary" id="add-row-btn" type="button">+ ターミナルを追加</button>
        </div>
      </section>
    </div>
    <div class="start-bar"><button class="button" id="start-btn" type="button" disabled>セッションを起動</button></div>
    <p id="status" aria-live="polite"></p>
    <datalist id="name-suggestions"><option value="orchestrator"></option><option value="planner"></option><option value="worker"></option><option value="reviewer"></option><option value="tester"></option><option value="utility"></option></datalist>
  </main>

  <main id="terminal-view">
    <div class="terminal-topbar"><strong>agent-wrapper</strong><span id="session-count"></span></div>
    <div class="terminal-grid" id="grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script>
    const HARNESSES = ["claude", "codex", "opencode"];
    const DEFAULT_ROWS = [
      { name: "orchestrator", harness: "claude" },
      { name: "planner", harness: "claude" },
      { name: "worker", harness: "opencode" },
      { name: "reviewer", harness: "opencode" },
      { name: "utility", harness: "opencode", source: "ollama" },
    ];
    const SESSION_CONFIG_KEY = "agent-wrapper-session-config";
    const rowsBody = document.getElementById("rows-body");
    const folderPathEl = document.getElementById("folder-path");
    const startBtn = document.getElementById("start-btn");
    const statusEl = document.getElementById("status");
    const recentFoldersEl = document.getElementById("recent-folders");
    let selectedFolder = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }

    function selectFolder(path) {
      selectedFolder = path;
      folderPathEl.textContent = path;
      folderPathEl.classList.add("is-selected");
      startBtn.disabled = false;
      setStatus("");
    }

    async function fetchRecentFolders() {
      try {
        const response = await fetch("/recent-folders");
        if (!response.ok) return;
        const data = await response.json();
        const folders = Array.isArray(data.folders) ? data.folders.filter((path) => typeof path === "string" && path) : [];
        if (!folders.length) return;
        recentFoldersEl.append(Object.assign(document.createElement("p"), { className: "recent-folders-title", textContent: "最近使ったフォルダ" }));
        folders.forEach((path) => {
          const button = document.createElement("button");
          button.className = "recent-folder-btn";
          button.type = "button";
          button.textContent = path;
          button.onclick = () => selectFolder(path);
          recentFoldersEl.append(button);
        });
        recentFoldersEl.hidden = false;
      } catch (_) { /* Recent folders are optional. */ }
    }

    function fillSelect(select, options, placeholder) {
      select.replaceChildren();
      if (placeholder) {
        const option = new Option(placeholder, "");
        option.disabled = true;
        option.selected = true;
        select.add(option);
      }
      options.forEach((value) => select.add(new Option(value, value)));
    }

    async function fetchModels(harness) {
      const response = await fetch("/models?harness=" + encodeURIComponent(harness));
      if (!response.ok) throw new Error("モデル候補を取得できませんでした");
      return response.json();
    }

    async function refreshSourceAndModel(row, preferred = {}) {
      const requestId = String(Date.now() + Math.random());
      row.dataset.modelRequest = requestId;
      const sourceSelect = row.querySelector(".source-select");
      const modelSelect = row.querySelector(".model-select");
      sourceSelect.disabled = true;
      modelSelect.disabled = true;
      try {
        const modelsBySource = await fetchModels(row.querySelector(".harness-select").value);
        if (row.dataset.modelRequest !== requestId) return;
        const sources = Object.keys(modelsBySource);
        fillSelect(sourceSelect, sources, sources.length ? null : "候補なし");
        sourceSelect.value = sources.includes(preferred.source) ? preferred.source : sources[0] || "";
        const applyModels = () => {
          const models = modelsBySource[sourceSelect.value] || [];
          fillSelect(modelSelect, models, models.length ? null : "候補なし");
          modelSelect.value = models.includes(preferred.model) ? preferred.model : models[0] || "";
        };
        sourceSelect.onchange = () => { preferred.model = ""; applyModels(); };
        applyModels();
      } catch (error) {
        if (row.dataset.modelRequest !== requestId) return;
        fillSelect(sourceSelect, [], "取得失敗");
        fillSelect(modelSelect, [], "取得失敗");
        setStatus(error.message, true);
      } finally {
        if (row.dataset.modelRequest === requestId) {
          sourceSelect.disabled = false;
          modelSelect.disabled = false;
        }
      }
    }

    function updateRowCount() {
      const count = rowsBody.children.length;
      document.getElementById("row-count").textContent = `${count} terminal${count === 1 ? "" : "s"}`;
    }

    function addRow(preset = {}) {
      const row = document.createElement("div");
      row.className = "terminal-row";
      row.innerHTML = `
        <div class="field"><label>名前</label><input class="name-input" type="text" list="name-suggestions" placeholder="worker" autocomplete="off"></div>
        <div class="field"><label>Harness</label><select class="harness-select"></select></div>
        <div class="field"><label>Source</label><select class="source-select"></select></div>
        <div class="field"><label>Model</label><select class="model-select"></select></div>
        <button class="button ghost remove-row-btn" type="button" aria-label="このターミナルを削除">×</button>`;
      row.querySelector(".name-input").value = preset.name || "";
      const harnessSelect = row.querySelector(".harness-select");
      fillSelect(harnessSelect, HARNESSES);
      harnessSelect.value = HARNESSES.includes(preset.harness) ? preset.harness : HARNESSES[0];
      harnessSelect.onchange = () => refreshSourceAndModel(row);
      row.querySelector(".remove-row-btn").onclick = () => { row.remove(); updateRowCount(); };
      rowsBody.append(row);
      updateRowCount();
      refreshSourceAndModel(row, preset);
    }

    function terminalConfig() {
      return [...rowsBody.querySelectorAll(".terminal-row")].map((row) => ({
        name: row.querySelector(".name-input").value.trim(),
        harness: row.querySelector(".harness-select").value,
        source: row.querySelector(".source-select").value,
        model: row.querySelector(".model-select").value,
      })).filter((terminal) => terminal.name);
    }

    document.getElementById("add-row-btn").onclick = () => addRow();
    document.getElementById("pick-folder-btn").onclick = async () => {
      setStatus("フォルダ選択を待機しています...");
      try {
        const response = await fetch("/pick-folder");
        const data = await response.json();
        if (data.path) {
          selectFolder(data.path);
        } else setStatus("フォルダは選択されませんでした。");
      } catch (error) { setStatus("フォルダ選択に失敗しました。", true); }
    };

    startBtn.onclick = async () => {
      const terminals = terminalConfig();
      if (!terminals.length) return setStatus("少なくとも1つの名前を入力してください。", true);
      startBtn.disabled = true;
      setStatus("セッションを起動しています...");
      try {
        const response = await fetch("/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cwd: selectedFolder, terminals }),
        });
        if (!response.ok) throw new Error("セッションを起動できませんでした");
        const data = await response.json();
        localStorage.setItem(SESSION_CONFIG_KEY, JSON.stringify(terminals));
        showTerminals(data.names, terminals);
      } catch (error) {
        startBtn.disabled = false;
        setStatus(error.message, true);
      }
    };

    function showTerminals(names, configurations = []) {
      document.getElementById("setup-view").style.display = "none";
      document.getElementById("terminal-view").style.display = "block";
      document.getElementById("session-count").textContent = `${names.length} ACTIVE SESSION${names.length === 1 ? "" : "S"}`;
      const grid = document.getElementById("grid");
      grid.style.setProperty("--pane-count", names.length);
      const configByName = new Map(configurations.map((config) => [config.name, config]));
      names.forEach((name) => {
        const config = configByName.get(name) || {};
        const pane = document.createElement("section");
        pane.className = "pane";
        const header = document.createElement("header");
        header.className = "pane-header";
        const nameEl = document.createElement("span");
        nameEl.className = "pane-name";
        nameEl.textContent = name;
        const badge = document.createElement("span");
        badge.className = "harness-badge";
        badge.textContent = config.harness || "session";
        const meta = document.createElement("span");
        meta.className = "pane-meta";
        meta.textContent = [config.source, config.model].filter(Boolean).join(" / ") || "既存セッション";
        const termEl = document.createElement("div");
        termEl.className = "term";
        header.append(nameEl, badge, meta);
        pane.append(header, termEl);
        grid.append(pane);
        const term = new Terminal({ convertEol: true, cursorBlink: true, fontFamily: "IBM Plex Mono, monospace", fontSize: 13, theme: { background: "#0c1016", foreground: "#e8edf5" } });
        term.open(termEl);
        const ws = new WebSocket("ws://127.0.0.1:8766/" + name);
        ws.onmessage = (event) => term.write(event.data);
        ws.onclose = () => term.write("\r\n[接続が切断されました]\r\n");
        ws.onerror = () => term.write("\r\n[接続エラー]\r\n");
        term.onData((data) => { if (ws.readyState === WebSocket.OPEN) ws.send(data); });
      });
    }

    DEFAULT_ROWS.forEach(addRow);
    fetchRecentFolders();
    fetch("/sessions").then((response) => response.json()).then((data) => {
      if (!data.names?.length) return;
      let configurations = [];
      try { configurations = JSON.parse(localStorage.getItem(SESSION_CONFIG_KEY)) || []; } catch (_) { /* Ignore malformed local storage. */ }
      showTerminals(data.names, configurations);
    }).catch(() => {});
  </script>
</body>
</html>
