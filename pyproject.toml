[project]
name = "agent-wrapper"
version = "0.1.0"
description = "Approval-gated wrapper around Claude Code / Codex: every dangerous operation goes through a rules regex, an Ollama content triage, and a human dashboard approval."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.113",
    "flask==3.1.3",
    "mcp==1.28.1",
    "psutil>=7.2.2",
    "qrcode==8.2",
    "requests==2.32.3",
]

[dependency-groups]
dev = [
    "mypy==2.1.0",
    "pytest>=9.0.3",
    "ruff==0.15.20",
    "types-qrcode==8.2.0.20260518",
    "types-requests==2.33.0.20260518",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
agent-wrapper = "agent_wrapper.main:main"

[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_wrapper"]
